# Builds Panna for Windows, macOS, Linux (desktop/, Electron) and iOS (ios/, Capacitor; unsigned, for sideloading).
# Run it from the Actions tab ("Run workflow"); the files are attached to the run as artifacts. To release them,
# create a draft release, then run "Attach build files to a release" (attach.yml) with this run's ID and the tag,
# check the files and publish. (No tag trigger: publishing creates the tag, and a rebuild must not replace the
# files that were checked.)
# The Android APK is built and signed locally (the release key never leaves the maintainer's machine).
name: Desktop and iOS builds

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux, os: ubuntu-24.04, flags: --linux }
          - { name: Windows, os: windows-2025, flags: --win }
          - { name: macOS, os: macos-15, flags: --mac }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
        working-directory: desktop
      - run: npx electron-builder ${{ matrix.flags }} --publish never
        working-directory: desktop
      - uses: actions/upload-artifact@v4
        with:
          name: panna-${{ matrix.name }}
          if-no-files-found: error
          path: |
            desktop/dist/*.AppImage
            desktop/dist/*.deb
            desktop/dist/*.exe
            desktop/dist/*.zip
            desktop/dist/*.dmg

  ios:
    name: iOS
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx cap sync ios
      - name: Build (unsigned)
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Package .ipa
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qry "Panna-$VERSION-ios-unsigned.ipa" Payload
      - uses: actions/upload-artifact@v4
        with:
          name: panna-iOS
          if-no-files-found: error
          path: Panna-*-ios-unsigned.ipa

